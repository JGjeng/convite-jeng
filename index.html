<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Convite de Casamento | Jennifer & Guilherme</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Contêiner de rolagem com efeito Snap */
    .convite-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      background-color: #f7f3ec;
    }

    /* Oculta barra de rolagem */
    .convite-container::-webkit-scrollbar {
      display: none;
    }
    .convite-container {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Cada página em tela cheia na proporção 9:16 */
    .pagina {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pagina img.bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Indicador animado de arraste na capa */
    .scroll-indicator {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #635245;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: bounce 2s infinite;
      pointer-events: none;
      background: rgba(247, 243, 236, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .scroll-indicator svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -10px); }
      60% { transform: translate(-50%, -5px); }
    }

    /* Grade com botões sobre os ícones da Página 4 */
    .grid-botoes {
      position: absolute;
      top: 25%;
      left: 6%;
      width: 88%;
      height: 48%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      z-index: 10;
    }

    .btn-touch {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    /* Feedback tátil ao clicar */
    .btn-touch:active {
      background: rgba(109, 91, 79, 0.18);
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="convite-container">
    
    <!-- Lâmina 1: Capa com Selo e Flores -->
    <section class="pagina">
      <img src="p1.jpg" alt="Capa do Convite" class="bg">
      <div class="scroll-indicator">
        <span>Role para abrir</span>
        <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </div>
    </section>

    <!-- Lâmina 2: Venha celebrar nosso amor... -->
    <section class="pagina">
      <img src="p2.jpg" alt="Detalhes do Casamento" class="bg">
    </section>

    <!-- Lâmina 3: Mensagem aos Convidados e Informações do Jantar/Pix -->
    <section class="pagina">
      <img src="p3.jpg" alt="Informações Jantar e Presente" class="bg">
    </section>

    <!-- Lâmina 4: Botões Interativos -->
    <section class="pagina">
      <img src="p4.jpg" alt="Menu de Ações" class="bg">
      
      <!-- Áreas Clicáveis sobre os 4 ícones -->
      <div class="grid-botoes">
        <!-- 1. Confirme sua presença -->
        <a href="https://jgjeng.github.io/casamento-jeng/" class="btn-touch" title="Confirmar Presença"></a>

        <!-- 2. Localização (Google Maps) -->
        <a href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o+Racket+Garden+Nova+Hartz+RS" target="_blank" class="btn-touch" title="Localização no Mapa"></a>

        <!-- 3. Fale com a Noiva -->
        <a href="https://api.whatsapp.com/qr/GPJ7C7NJDKHXC1?autoload=1&app_absent=0" target="_blank" class="btn-touch" title="Fale com a Noiva"></a>

        <!-- 4. Fale com o Noivo -->
        <a href="https://api.whatsapp.com/qr/FADDQMDGFSDWH1?autoload=1&app_absent=0" target="_blank" class="btn-touch" title="Fale com o Noivo"></a>
      </div>
    </section>

    <!-- Lâmina 5: Aguardamos Vocês! -->
    <section class="pagina">
      <img src="p5.jpg" alt="Encerramento" class="bg">
    </section>

  </div>

</body>
</html>
