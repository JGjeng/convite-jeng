<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Convite de Casamento | Jennifer & Guilherme</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .convite-container {
      width: 100%;
      max-width: 460px;
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      background-color: #f7f3ec;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .convite-container::-webkit-scrollbar {
      display: none;
    }
    .convite-container {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .pagina {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f3ec;
    }

    .art-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .art-wrapper img.bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Indicador na primeira lâmina */
    .scroll-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #635245;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: bounce 2s infinite;
      pointer-events: none;
      background: rgba(247, 243, 236, 0.9);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .scroll-indicator svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -8px); }
      60% { transform: translate(-50%, -4px); }
    }

    /* Grade interativa dimensionada para a lâmina 4 */
    .grid-botoes {
      position: absolute;
      top: 25%;
      left: 8%;
      width: 84%;
      height: 50%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      z-index: 10;
    }

    .btn-touch {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .btn-touch:active {
      background: rgba(109, 91, 79, 0.2);
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="convite-container">
    
    <!-- Lâmina 1 -->
    <section class="pagina">
      <div class="art-wrapper">
        <img src="p1.jpg" alt="Capa" class="bg">
        <div class="scroll-indicator">
          <span>Role para abrir</span>
          <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </div>
      </div>
    </section>

    <!-- Lâmina 2 -->
    <section class="pagina">
      <div class="art-wrapper">
        <img src="p2.jpg" alt="Celebração" class="bg">
      </div>
    </section>

    <!-- Lâmina 3 -->
    <section class="pagina">
      <div class="art-wrapper">
        <img src="p3.jpg" alt="Informações" class="bg">
      </div>
    </section>

    <!-- Lâmina 4 -->
    <section class="pagina">
      <div class="art-wrapper">
        <img src="p4.jpg" alt="Ações" class="bg">
        
        <div class="grid-botoes">
          <!-- 1. Confirme sua presença -->
          <a href="https://jgjeng.github.io/casamento-jeng/" class="btn-touch" title="Confirmar Presença"></a>

          <!-- 2. Localização -->
          <a href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o+Racket+Garden+Nova+Hartz+RS" target="_blank" class="btn-touch" title="Localização"></a>

          <!-- 3. Fale com a Noiva -->
          <a href="https://api.whatsapp.com/qr/GPJ7C7NJDKHXC1?autoload=1&app_absent=0" target="_blank" class="btn-touch" title="Fale com a Noiva"></a>

          <!-- 4. Fale com o Noivo -->
          <a href="https://api.whatsapp.com/qr/FADDQMDGFSDWH1?autoload=1&app_absent=0" target="_blank" class="btn-touch" title="Fale com o Noivo"></a>
        </div>
      </div>
    </section>

    <!-- Lâmina 5 -->
    <section class="pagina">
      <div class="art-wrapper">
        <img src="p5.jpg" alt="Agradecimento" class="bg">
      </div>
    </section>

  </div>

</body>
</html>
